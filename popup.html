<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLPI Planejador</title>
<style>
 body{font:14px Segoe UI,Arial,sans-serif;width:320px;margin:0;padding:16px;color:#1f2937} h1{font-size:17px;margin:0 0 10px}
 p{line-height:1.45;margin:8px 0} button{border:0;border-radius:5px;background:#2563eb;color:#fff;padding:9px 12px;font-weight:600;cursor:pointer}
 button.sec{background:#e5e7eb;color:#1f2937} button:disabled{opacity:.6;cursor:wait}
 .row{display:flex;gap:8px;margin:10px 0}.state{padding:9px;background:#f3f4f6;border-radius:5px;margin:10px 0}
 .small{color:#5b6472;font-size:12px} label{display:flex;align-items:center;gap:6px;margin:8px 0} input[type=number]{width:60px}
</style>
<h1>GLPI Planejador</h1>
<p>Regra: chamados com status <b>Novo</b> → <b>Em atendimento (planejado)</b>.</p>
<div class="state" id="state">Verificando…</div>
<div class="row"><button id="toggle">…</button><button id="run" class="sec">Executar agora</button></div>
<label><input type="checkbox" id="auto"> Recarregar a lista a cada <input type="number" id="secs" min="15" step="5"> s</label>
<p class="small" id="last"></p>
<script src="popup.js"></script>
</html>
